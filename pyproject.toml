[project]
name = "cs2hl"
version = "0.1.0"
description = "Automatic CS2 highlight clips from demos, rendered frame-by-frame via CS Demo Manager"
requires-python = ">=3.11"
dependencies = [
    "demoparser2>=0.40",
    "watchdog>=4.0",
]

[project.scripts]
cs2hl = "cs2hl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cs2hl*"]
